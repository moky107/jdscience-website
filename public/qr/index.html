<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JD Science QR Code | Scan to visit jdscience.co.uk</title>
  <meta name="description" content="Scan this QR code to open the JD Science website at jdscience.co.uk." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #0f172a;
      background: #f8fafc;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border: 1px solid #d9e2ec;
      border-radius: 18px;
      padding: 28px 24px 24px;
      text-align: center;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: #009688;
      color: #fff;
      font-weight: 800;
      font-size: 22px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      color: #004d40;
    }
    p {
      margin: 0 0 20px;
      line-height: 1.55;
      color: #64748b;
    }
    img {
      width: min(100%, 280px);
      height: auto;
      display: block;
      margin: 0 auto 16px;
    }
    .url {
      font-weight: 700;
      color: #0f766e;
      word-break: break-all;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 18px;
    }
    a.btn {
      display: inline-block;
      background: #009688;
      color: #fff !important;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
    }
    a.link {
      color: #0f766e;
      font-weight: 700;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .card { box-shadow: none; border: none; }
      .actions { display: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand" aria-hidden="true">JD</div>
    <h1>Scan to visit JD Science</h1>
    <p>Point your phone camera at the code below to open our website.</p>
    <img src="/jdscience-qr-code.svg" width="280" height="280" alt="QR code linking to https://www.jdscience.co.uk" />
    <p class="url">www.jdscience.co.uk</p>
    <div class="actions">
      <a class="btn" href="/jdscience-qr-code.png" download="jdscience-qr-code.png">Download PNG</a>
      <a class="btn" href="/jdscience-qr-code.svg" download="jdscience-qr-code.svg">Download SVG</a>
      <a class="link" href="/">Back to site</a>
    </div>
  </main>
</body>
</html>
